name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: ci
      # Throwaway credentials for CI-only containers; not a real secret.
      DATABASE_URL: postgresql+psycopg://finsight:ci-only@localhost:5432/finsight
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: finsight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finsight" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'" --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
